<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d130c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BANG!" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>BANG! — Mobilní edice</title>
  <style>
:root {
  --wood-dark: #1d130c;
  --parchment: #f4e4c1;
  --ink: #241810;
  --ink-muted: #5c4433;
  --brown-card: #8b5a2b;
  --blue-card: #2b5b84;
  --gold: #d4a017;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: radial-gradient(circle at 50% 30%, #3d2818 0%, #1d130c 75%, #120b07 100%);
  color: var(--parchment);
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none;
}
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 1180px;
  margin: 0 auto;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
.mobile-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(18, 11, 7, 0.94);
  border-bottom: 2px solid #6b4423;
  flex-shrink: 0;
}
.brand-title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--gold);
}
.top-btns { display: flex; gap: 6px; }
.btn {
  background: linear-gradient(180deg, #8b5a2b 0%, #633e1c 100%);
  color: #fff7e6;
  border: 1px solid #c28e4e;
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 13px;
  font-weight: 700;
  font-family: system-ui, sans-serif;
  cursor: pointer;
}
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%); border-color: #ef4444; }
.btn-gold { background: linear-gradient(180deg, #d4a017 0%, #92670a 100%); border-color: #fde047; color: #1c1208; }

/* Opponents Strip (Phone) -> Grid (iPad) */
.opponents-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 10px;
  scroll-snap-type: x mandatory;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
.opponents-strip::-webkit-scrollbar { display: none; }
.player-seat {
  position: relative;
  min-width: 152px;
  max-width: 170px;
  scroll-snap-align: start;
  background: linear-gradient(180deg, rgba(58, 37, 22, 0.95) 0%, rgba(34, 21, 13, 0.98) 100%);
  border: 2px solid #6b4423;
  border-radius: 10px;
  padding: 7px 8px;
  flex-shrink: 0;
}
.player-seat.active-turn { border-color: var(--gold); box-shadow: 0 0 12px rgba(212, 160, 23, 0.5); }
.player-seat.dead { opacity: 0.4; filter: grayscale(0.8); }
.player-seat.targetable {
  border-color: #ef4444;
  box-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
  animation: pulseTarget 1s infinite;
}
@keyframes pulseTarget { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
.seat-header { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 4px; }
.seat-name { font-weight: 700; font-size: 13px; color: #fef3c7; }
.role-pill {
  font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 999px; background: #291a10;
  border: 1px solid #78502b; color: #e5d2b3; white-space: nowrap;
}
.role-pill.sheriff { background: #854d0e; border-color: #facc15; color: #fef08a; }
.role-pill.deputy { background: #1e3a8a; border-color: #60a5fa; color: #dbeafe; }
.role-pill.outlaw { background: #7f1d1d; border-color: #f87171; color: #fee2e2; }
.role-pill.renegade { background: #581c87; border-color: #c084fc; color: #f3e8ff; }
.seat-body { display: flex; gap: 6px; align-items: center; }
.seat-avatar { width: 42px; height: 36px; border-radius: 5px; overflow: hidden; border: 1px solid #8b5a2b; flex-shrink: 0; }
.seat-avatar svg { width: 100%; height: 100%; display: block; }
.seat-stats { flex: 1; min-width: 0; }
.char-label { font-size: 11px; font-weight: 700; color: #f3d69d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-bullets { display: flex; gap: 2px; margin: 3px 0; flex-wrap: wrap; }
.bullet {
  width: 9px; height: 13px; border-radius: 4px 4px 2px 2px;
  background: linear-gradient(90deg, #b45309 0%, #fbbf24 50%, #92400e 100%);
  border: 1px solid #451a03;
}
.bullet.lost { background: #261910; border-color: #4b3424; opacity: 0.4; }
.seat-meta { display: flex; gap: 6px; font-size: 10px; font-family: system-ui, sans-serif; color: #d6bfa0; }
.seat-table-cards { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.mini-blue-card {
  font-family: system-ui, sans-serif; font-size: 10px; font-weight: 600;
  padding: 1px 5px; border-radius: 4px; background: #1e3a5f; border: 1px solid #60a5fa; color: #e0f2fe;
}
.mini-blue-card.hazard { background: #5c1919; border-color: #f87171; color: #fee2e2; }
.toast-bubble {
  position: absolute; top: -6px; right: 4px; background: #fef3c7; color: #1c1917;
  font-family: system-ui, sans-serif; font-size: 11px; font-weight: 800;
  padding: 2px 7px; border-radius: 999px; border: 2px solid #b45309; z-index: 10;
}

/* Center Compact Table */
.center-felt {
  flex: 1;
  margin: 0 10px;
  background: radial-gradient(ellipse at center, #2d4c32 0%, #1c3320 100%);
  border: 3px solid #6b4423;
  border-radius: 14px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.6);
}
.piles-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.pile-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.pile-label { font-size: 10px; font-family: system-ui, sans-serif; color: #d1fae5; }
.card-back {
  width: 66px; height: 96px; border-radius: 7px;
  background: linear-gradient(135deg, #7c4d25 0%, #4e2d13 100%);
  border: 3px solid #f8f1e0; outline: 1px solid #451a03;
  display: flex; align-items: center; justify-content: center;
}
.card-back-logo {
  font-size: 12px; font-weight: 900; color: #fde68a; transform: rotate(-12deg);
  border: 1.5px solid #fde68a; padding: 2px 4px; border-radius: 3px;
}
.turn-banner {
  text-align: center;
  background: rgba(0,0,0,0.35);
  border-radius: 8px;
  padding: 6px 10px;
}
.turn-banner h3 { margin: 0; font-size: 15px; color: #fef08a; }
.turn-banner p { margin: 2px 0 0 0; font-size: 12px; font-family: system-ui, sans-serif; color: #e2e8f0; }

/* Bottom Human Dock */
.human-dock {
  background: linear-gradient(180deg, rgba(46, 30, 18, 0.98) 0%, rgba(22, 14, 8, 1) 100%);
  border-top: 2px solid #8b5a2b;
  padding: 8px 10px 10px 10px;
  flex-shrink: 0;
}
.human-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.human-id { display: flex; align-items: center; gap: 8px; min-width: 0; }
.human-actions { display: flex; gap: 6px; flex-shrink: 0; }
.hand-carousel {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 2px 4px 2px;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.hand-carousel::-webkit-scrollbar { display: none; }

/* Authentic Physical BANG! Card Frame (Outer ivory rim + inner colored border + aged parchment) */
.bang-card {
  width: 112px; height: 164px; border-radius: 9px;
  background: #f8f1e0; padding: 3px;
  color: var(--ink); display: flex; flex-direction: column;
  position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.55); flex-shrink: 0;
  scroll-snap-align: start;
}
.bang-card-inner {
  flex: 1; border-radius: 6px; background: #f3e5c8;
  display: flex; flex-direction: column; padding: 4px;
  position: relative; overflow: hidden;
}
.bang-card.border-brown .bang-card-inner { border: 3.5px solid #8b5a2b; }
.bang-card.border-blue .bang-card-inner { border: 3.5px solid #3b6998; }
.bang-card.border-gold .bang-card-inner { border: 3.5px solid #6b4423; }
.bang-card.playable { box-shadow: 0 0 0 2.5px #fde047, 0 4px 14px rgba(250, 204, 21, 0.5); }
.bang-card.selected-discard { outline: 3px solid #ef4444; transform: translateY(-6px); }
.bang-card.small { width: 72px; height: 104px; padding: 2px; }
.bang-card.small .bang-card-inner { padding: 2px; border-width: 2.5px; }
.bang-card.small .card-title { font-size: 8px; }
.bang-card.small .card-desc { display: none; }
.bang-card.small .card-symbols { font-size: 7.5px; }
.card-title {
  text-align: center; font-size: 10.5px; font-weight: 900; text-transform: uppercase;
  letter-spacing: 0.4px; border-bottom: 1px solid rgba(69, 26, 3, 0.35);
  padding-bottom: 2px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-art-wrap { width: 100%; height: 66px; border-radius: 2px; overflow: hidden; border: 1px solid rgba(92, 68, 51, 0.45); }
.bang-card.small .card-art-wrap { height: 48px; }
.card-art-svg, .char-art-svg, .role-art-svg { width: 100%; height: 100%; display: block; }
.card-symbols { font-family: system-ui, sans-serif; font-size: 8.8px; font-weight: 800; color: #3b2618; text-align: center; margin-top: 3px; }
.card-desc {
  font-family: system-ui, sans-serif; font-size: 8px; line-height: 1.18; color: var(--ink-muted);
  text-align: center; margin-top: 2px; overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.card-suit-badge {
  position: absolute; bottom: 2px; left: 4px; font-family: Georgia, serif;
  font-size: 11px; font-weight: 900; background: rgba(248, 241, 224, 0.92);
  padding: 0 3px; border-radius: 2px;
}
.char-bullets-side {
  position: absolute; right: 3px; top: 22px; display: flex; flex-direction: column; gap: 2px;
  background: rgba(248, 241, 224, 0.85); padding: 2px; border-radius: 3px; border: 1px solid #8b5a2b;
}
.char-bullet-icon {
  width: 6px; height: 11px; border-radius: 3px 3px 1px 1px;
  background: linear-gradient(90deg, #92400e, #fbbf24, #78350f);
  border: 0.5px solid #451a03;
}

/* iPad & Tablet Responsive Layout */
@media (min-width: 768px) {
  .opponents-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    overflow-x: visible;
    padding: 10px 14px;
  }
  .player-seat { max-width: none; min-width: 0; }
  .center-felt { margin: 0 14px; padding: 14px 20px; flex-direction: row; align-items: center; }
  .turn-banner { flex: 1; margin-left: 20px; padding: 12px 16px; }
  .human-dock { padding: 10px 16px 14px 16px; }
  .bang-card { width: 126px; height: 184px; }
  .card-art-wrap { height: 76px; }
  .card-title { font-size: 11.5px; }
  .card-desc { font-size: 8.8px; }
}

/* Modals */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 12px;
}
.modal-backdrop.hidden { display: none; }
.modal-box {
  background: #2b1d12; border: 2.5px solid var(--gold); border-radius: 14px;
  width: 100%; max-width: 500px; max-height: 88dvh; overflow-y: auto;
  padding: 14px; color: var(--parchment);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #6b4423; padding-bottom: 6px; }
.modal-header h2 { margin: 0; font-size: 18px; color: var(--gold); }
.modal-cards-row, .gallery-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
.gallery-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.log-list { display: flex; flex-direction: column; gap: 5px; font-family: system-ui, sans-serif; font-size: 12px; }
.log-item { padding: 5px 7px; border-radius: 4px; background: rgba(255,255,255,0.04); }
.log-item.danger { border-left: 3px solid #ef4444; color: #fecaca; }
.log-item.good { border-left: 3px solid #22c55e; color: #bbf7d0; }
.log-item.important { border-left: 3px solid #eab308; color: #fef08a; font-weight: 700; }
.log-item.ability { border-left: 3px solid #38bdf8; color: #bae6fd; }
.log-item.action { border-left: 3px solid #d97706; color: #fde68a; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="mobile-topbar">
      <div class="brand-title">BANG!</div>
      <div class="top-btns">
        <button class="btn" id="btn-speed" title="Rychlost hry">🐢 1×</button>
        <button class="btn" id="btn-log">📜</button>
        <button class="btn" id="btn-gallery">🃏 103</button>
        <button class="btn" id="btn-rules">❓</button>
        <button class="btn btn-gold" id="btn-new-game">Nová</button>
      </div>
    </header>

    <section class="opponents-strip" id="opponents-grid"></section>

    <section class="center-felt">
      <div class="piles-row">
        <div class="pile-box">
          <div class="card-back"><div class="card-back-logo">BANG!</div></div>
          <div class="pile-label" id="deck-count">80 karet</div>
        </div>
        <div class="pile-box">
          <div id="discard-top"></div>
          <div class="pile-label">Odhazovací</div>
        </div>
      </div>
      <div class="turn-banner">
        <h3 id="turn-title">Vítej v Saloonu!</h3>
        <p id="turn-subtitle">Nastav hru a začni přestřelku.</p>
      </div>
    </section>

    <section class="human-dock">
      <div class="human-bar">
        <div class="human-id">
          <div class="seat-avatar" id="human-avatar"></div>
          <div style="min-width:0">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
              <strong id="human-char-name" style="color:#fde68a;font-size:13px">—</strong>
              <span class="role-pill" id="human-role">Role</span>
            </div>
            <div class="hp-bullets" id="human-bullets"></div>
            <div class="seat-table-cards" id="human-table-cards"></div>
          </div>
        </div>
        <div class="human-actions">
          <button class="btn" id="btn-sid-heal" style="display:none">🩺 +1♥</button>
          <button class="btn btn-primary" id="btn-cancel-target" style="display:none">Zrušit</button>
          <button class="btn btn-gold" id="btn-end-turn" disabled>Konec tahu</button>
        </div>
      </div>
      <div class="hand-carousel" id="human-hand"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="setup-modal">
    <div class="modal-box">
      <div class="modal-header"><h2>🤠 BANG! Mobilní edice</h2></div>
      <div style="display:flex;flex-direction:column;gap:12px;font-family:system-ui,sans-serif;font-size:14px">
        <label style="display:flex;flex-direction:column;gap:4px">
          <strong>Počet hráčů (4–7):</strong>
          <select id="setup-players" style="padding:10px;border-radius:8px;background:#1d130c;color:#fef3c7;border:1px solid #8b5a2b">
            <option value="4">4 hráči (Šerif, Odpadlík, 2 Bandité)</option>
            <option value="5" selected>5 hráčů (Šerif, Odpadlík, 2 Bandité, 1 Pomocník)</option>
            <option value="6">6 hráčů (Šerif, Odpadlík, 3 Bandité, 1 Pomocník)</option>
            <option value="7">7 hráčů (Šerif, Odpadlík, 3 Bandité, 2 Pomocníci)</option>
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:4px">
          <strong>Tvá postava:</strong>
          <select id="setup-character" style="padding:10px;border-radius:8px;background:#1d130c;color:#fef3c7;border:1px solid #8b5a2b"></select>
        </label>
        <button class="btn btn-gold" id="btn-start-game" style="padding:12px;font-size:16px">Rozdat karty & Hrát!</button>
        <div style="font-size:12px;color:#cbb593;text-align:center">
          Tip: V prohlížeči na mobilu zvol <strong>„Přidat na plochu“</strong> pro instalaci jako nativní aplikaci (funguje i offline).
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="prompt-modal">
    <div class="modal-box">
      <div class="modal-header"><h2 id="prompt-title">Výběr</h2></div>
      <div id="prompt-body"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>

function buildDeck() {
  return DECK_SPEC.map(([type, rank, suit], idx) => {
    const tpl = CARD_TYPES[type];
    return {
      uid: `card_${idx}_${type}_${rank}${suit}`,
      type,
      rank,
      suit,
      ...tpl
    };
  });
}

function getRoleDistribution(playerCount) {
  switch (playerCount) {
    case 4: return ['sheriff', 'renegade', 'outlaw', 'outlaw'];
    case 5: return ['sheriff', 'renegade', 'outlaw', 'outlaw', 'deputy'];
    case 6: return ['sheriff', 'renegade', 'outlaw', 'outlaw', 'outlaw', 'deputy'];
    case 7: return ['sheriff', 'renegade', 'outlaw', 'outlaw', 'outlaw', 'deputy', 'deputy'];
    default: return ['sheriff', 'renegade', 'outlaw', 'outlaw'];
  }
}

// Complete Official BANG! Base Game Engine (Async/Promise-driven for smooth UI & AI)

class BangEngine {
  constructor(ui) {
    this.ui = ui;
    this.players = [];
    this.deck = [];
    this.discard = [];
    this.turnIndex = 0;
    this.bangsPlayedThisTurn = 0;
    this.gameOver = false;
    this.winner = null;
    this.logEntries = [];
    this.phase = 'setup'; // setup, start, draw, play, discard, gameover
  }

  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  log(msg, tone = 'info') {
    this.logEntries.unshift({ msg, tone, time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
    if (this.logEntries.length > 60) this.logEntries.pop();
    this.ui.renderLog();
  }

  startNewGame(playerCount, chosenCharId = null) {
    this.gameOver = false;
    this.winner = null;
    this.logEntries = [];
    this.deck = this.shuffle(buildDeck());
    this.discard = [];

    const roleIds = this.shuffle(getRoleDistribution(playerCount));
    const chars = this.shuffle([...CHARACTERS]);

    // Ensure human gets chosenCharId if specified
    let humanChar;
    if (chosenCharId && chosenCharId !== 'random') {
      humanChar = CHARACTERS.find(c => c.id === chosenCharId);
      const rest = chars.filter(c => c.id !== chosenCharId);
      chars.splice(0, chars.length, humanChar, ...rest);
    }

    const aiNames = ['Bill', 'Dakota', 'Cheyenne', 'Wyatt', 'Annie', 'Butch'];
    this.players = [];

    for (let i = 0; i < playerCount; i++) {
      const roleObj = ROLES.find(r => r.id === roleIds[i]);
      const charObj = chars[i];
      const isSheriff = roleObj.id === 'sheriff';
      const maxHp = charObj.hp + (isSheriff ? 1 : 0);

      this.players.push({
        id: i,
        name: i === 0 ? 'Ty' : aiNames[i - 1],
        isHuman: i === 0,
        role: roleObj,
        character: charObj,
        hp: maxHp,
        maxHp,
        hand: [],
        table: [], // blue cards: weapon, barrel, mustang, scope, jail, dynamite
        alive: true,
        revealedRole: isSheriff,
        hostilityToSheriff: 0 // AI memory heuristic
      });
    }

    // Deal initial hands equal to maxHp
    for (const p of this.players) {
      for (let c = 0; c < p.maxHp; c++) {
        const card = this.drawCardRaw();
        if (card) p.hand.push(card);
      }
    }

    // Sheriff starts first
    this.turnIndex = this.players.findIndex(p => p.role.id === 'sheriff');
    this.log(`Nová hra pro ${playerCount} hráčů! Šerifem je ${this.players[this.turnIndex].name} (${this.players[this.turnIndex].character.name}).`, 'important');
    this.ui.renderAll();
    this.runTurnLoop();
  }

  livingPlayers() {
    return this.players.filter(p => p.alive);
  }

  drawCardRaw() {
    if (this.deck.length === 0) {
      if (this.discard.length === 0) return null;
      const top = this.discard.pop();
      this.deck = this.shuffle(this.discard);
      this.discard = top ? [top] : [];
      this.log('Dobírací balíček byl zamíchán z odhazovacího.', 'system');
    }
    return this.deck.pop();
  }

  giveCardToPlayer(player, card) {
    if (!card) return;
    player.hand.push(card);
  }

  discardCard(card) {
    if (!card) return;
    this.discard.push(card);
  }

  checkSuzyLafayette(player) {
    if (player.alive && player.character.id === 'suzy_lafayette' && player.hand.length === 0) {
      const c = this.drawCardRaw();
      if (c) {
        player.hand.push(c);
        this.log(`${player.name} (Suzy Lafayette) má prázdnou ruku a dobírá 1 kartu.`, 'ability');
      }
    }
  }

  // Distance from attacker A to target B
  getDistance(a, b) {
    if (a.id === b.id) return 0;
    const living = this.livingPlayers();
    const idxA = living.findIndex(p => p.id === a.id);
    const idxB = living.findIndex(p => p.id === b.id);
    if (idxA === -1 || idxB === -1) return 99;
    const n = living.length;
    let dist = Math.min((idxB - idxA + n) % n, (idxA - idxB + n) % n);

    if (b.table.some(c => c.type === 'mustang')) dist += 1;
    if (b.character.id === 'paul_regret') dist += 1;
    if (a.table.some(c => c.type === 'scope')) dist -= 1;
    if (a.character.id === 'rose_doolan') dist -= 1;

    return Math.max(1, dist);
  }

  getWeaponRange(player) {
    const weapon = player.table.find(c => c.category === 'weapon');
    return weapon ? weapon.range : 1;
  }

  hasUnlimitedBang(player) {
    if (player.character.id === 'willy_the_kid') return true;
    return player.table.some(c => c.type === 'volcanic');
  }

  hasCardOnTable(player, type) {
    return player.table.some(c => c.type === type);
  }

  // "Draw!" (líznout!) check — supports Lucky Duke!
  async performDrawCheck(player, reason) {
    if (player.character.id === 'lucky_duke') {
      const c1 = this.drawCardRaw();
      const c2 = this.drawCardRaw();
      if (!c1) return null;
      if (!c2) {
        this.discardCard(c1);
        return c1;
      }
      let chosen;
      if (player.isHuman) {
        chosen = await this.ui.promptLuckyDuke(c1, c2, reason);
      } else {
        // AI picks hearts if barrel/jail, or non-2-9-spades if dynamite
        if (reason === 'dynamite') {
          const isBad = c => c.suit === 'S' && ['2','3','4','5','6','7','8','9'].includes(c.rank);
          chosen = !isBad(c1) ? c1 : c2;
        } else {
          chosen = c1.suit === 'H' ? c1 : c2;
        }
      }
      this.discardCard(c1);
      this.discardCard(c2);
      this.log(`${player.name} (Lucky Duke) otočil ${c1.rank}${SUITS[c1.suit].symbol} a ${c2.rank}${SUITS[c2.suit].symbol}, vybral ${chosen.rank}${SUITS[chosen.suit].symbol}.`, 'ability');
      return chosen;
    } else {
      const c = this.drawCardRaw();
      if (!c) return null;
      this.discardCard(c);
      this.log(`${player.name} líznul pro ${reason}: ${c.name} (${c.rank}${SUITS[c.suit].symbol}).`, 'system');
      return c;
    }
  }

  async runTurnLoop() {
    while (!this.gameOver) {
      const p = this.players[this.turnIndex];
      if (!p.alive) {
        this.advanceTurnIndex();
        continue;
      }

      this.bangsPlayedThisTurn = 0;
      this.phase = 'start';
      this.ui.renderAll();

      // 1. DYNAMITE CHECK
      const dynIdx = p.table.findIndex(c => c.type === 'dynamite');
      if (dynIdx !== -1) {
        await this.sleep(450);
        const drawn = await this.performDrawCheck(p, 'Dynamit');
        const exploded = drawn && drawn.suit === 'S' && ['2','3','4','5','6','7','8','9'].includes(drawn.rank);
        const dynCard = p.table.splice(dynIdx, 1)[0];
        if (exploded) {
          this.discardCard(dynCard);
          this.log(`💥 DYNAMIT VYBUCHL u hráče ${p.name}! (-3 životy)`, 'danger');
          this.ui.showToast(p.id, '💥 BOOM! -3 ♥');
          await this.damagePlayer(p, 3, null);
          if (this.gameOver || !p.alive) {
            this.advanceTurnIndex();
            continue;
          }
        } else {
          // Pass to next living player
          const living = this.livingPlayers();
          const curIdx = living.findIndex(lp => lp.id === p.id);
          const nextP = living[(curIdx + 1) % living.length];
          nextP.table.push(dynCard);
          this.log(`Dynamit nevybuchl a posouvá se k hráči ${nextP.name}.`, 'system');
        }
        this.ui.renderAll();
      }

      // 2. JAIL CHECK
      const jailIdx = p.table.findIndex(c => c.type === 'jail');
      if (jailIdx !== -1) {
        await this.sleep(450);
        const drawn = await this.performDrawCheck(p, 'Vězení');
        const jailCard = p.table.splice(jailIdx, 1)[0];
        this.discardCard(jailCard);
        if (drawn && drawn.suit === 'H') {
          this.log(`🔓 ${p.name} utekl z Vězení! (♥ Srdce)`, 'good');
          this.ui.showToast(p.id, '🔓 Útěk!');
        } else {
          this.log(`⛓️ ${p.name} zůstává ve Vězení a vynechává tah.`, 'danger');
          this.ui.showToast(p.id, '⛓️ Vynechává tah');
          this.ui.renderAll();
          await this.sleep(700);
          this.advanceTurnIndex();
          continue;
        }
        this.ui.renderAll();
      }

      // 3. DRAW PHASE (Phase 1)
      this.phase = 'draw';
      this.ui.renderAll();
      await this.executeDrawPhase(p);
      if (this.gameOver) break;

      // 4. PLAY PHASE (Phase 2)
      this.phase = 'play';
      this.ui.renderAll();
      if (p.isHuman) {
        await this.ui.waitForHumanEndTurn();
      } else {
        await this.runAITurn(p);
      }
      if (this.gameOver) break;

      // 5. DISCARD PHASE (Phase 3)
      if (p.alive && p.hand.length > p.hp) {
        this.phase = 'discard';
        this.ui.renderAll();
        if (p.isHuman) {
          await this.ui.waitForHumanDiscard(p);
        } else {
          while (p.hand.length > p.hp) {
            const idx = this.pickAICardToDiscard(p);
            const [rem] = p.hand.splice(idx, 1);
            this.discardCard(rem);
            this.log(`${p.name} odhodil ${rem.name}.`, 'system');
          }
        }
      }

      this.checkSuzyLafayette(p);
      await this.sleep(600);
      this.advanceTurnIndex();
    }
  }

  advanceTurnIndex() {
    this.turnIndex = (this.turnIndex + 1) % this.players.length;
  }

  async executeDrawPhase(p) {
    if (p.character.id === 'kit_carlson') {
      const c1 = this.drawCardRaw();
      const c2 = this.drawCardRaw();
      const c3 = this.drawCardRaw();
      const pool = [c1, c2, c3].filter(Boolean);
      if (pool.length <= 2) {
        pool.forEach(c => p.hand.push(c));
      } else if (p.isHuman) {
        const { kept, returned } = await this.ui.promptKitCarlson(pool);
        kept.forEach(c => p.hand.push(c));
        this.deck.push(returned);
      } else {
        // AI keeps best 2, returns worst
        const sorted = [...pool].sort((a, b) => this.aiCardValue(b, p) - this.aiCardValue(a, p));
        p.hand.push(sorted[0], sorted[1]);
        this.deck.push(sorted[2]);
      }
      this.log(`${p.name} (Kit Carlson) si vybral 2 ze 3 vrchních karet.`, 'ability');
      return;
    }

    let firstCardDrawn = false;
    if (p.character.id === 'jesse_jones') {
      const candidates = this.livingPlayers().filter(o => o.id !== p.id && o.hand.length > 0);
      if (candidates.length > 0) {
        let target = null;
        if (p.isHuman) {
          target = await this.ui.promptJesseJones(candidates);
        } else if (Math.random() < 0.75) {
          target = candidates[Math.floor(Math.random() * candidates.length)];
        }
        if (target) {
          const rIdx = Math.floor(Math.random() * target.hand.length);
          const [stolen] = target.hand.splice(rIdx, 1);
          p.hand.push(stolen);
          this.checkSuzyLafayette(target);
          this.log(`${p.name} (Jesse Jones) si vzal 1. kartu z ruky hráče ${target.name}.`, 'ability');
          firstCardDrawn = true;
        }
      }
    } else if (p.character.id === 'pedro_ramirez' && this.discard.length > 0) {
      const topDiscard = this.discard[this.discard.length - 1];
      let takeDiscard = false;
      if (p.isHuman) {
        takeDiscard = await this.ui.promptPedroRamirez(topDiscard);
      } else {
        takeDiscard = this.aiCardValue(topDiscard, p) >= 5;
      }
      if (takeDiscard) {
        p.hand.push(this.discard.pop());
        this.log(`${p.name} (Pedro Ramirez) si vzal ${topDiscard.name} z odhazovacího balíčku.`, 'ability');
        firstCardDrawn = true;
      }
    }

    if (!firstCardDrawn) {
      const c1 = this.drawCardRaw();
      if (c1) p.hand.push(c1);
    }

    const c2 = this.drawCardRaw();
    if (c2) {
      p.hand.push(c2);
      if (p.character.id === 'black_jack') {
        this.log(`${p.name} (Black Jack) ukázal 2. kartu: ${c2.name} (${c2.rank}${SUITS[c2.suit].symbol}).`, 'ability');
        if (c2.suit === 'H' || c2.suit === 'D') {
          const c3 = this.drawCardRaw();
          if (c3) p.hand.push(c3);
          this.log(`♦/♥ Červená karta! ${p.name} dobírá 1 kartu navíc.`, 'good');
        }
      }
    }
  }

  // Can player play a specific card from hand during their Play phase?
  canPlayCard(player, card) {
    if (this.gameOver || !player.alive) return false;
    if (this.players[this.turnIndex].id !== player.id || this.phase !== 'play') return false;

    const isBang = card.type === 'bang' || (card.type === 'missed' && player.character.id === 'calamity_janet');
    if (isBang) {
      if (this.bangsPlayedThisTurn >= 1 && !this.hasUnlimitedBang(player)) return false;
      return this.getValidBangTargets(player).length > 0;
    }

    if (card.type === 'missed') return false; // normal Vedle! cannot be played on your turn
    if (card.type === 'beer') {
      if (this.livingPlayers().length <= 2) return false;
      return player.hp < player.maxHp;
    }
    if (card.type === 'panic') {
      return this.getValidPanicTargets(player).length > 0;
    }
    if (card.type === 'cat_balou') {
      return this.getValidCatBalouTargets(player).length > 0;
    }
    if (card.type === 'duel') {
      return this.livingPlayers().some(o => o.id !== player.id);
    }
    if (card.type === 'jail') {
      return this.livingPlayers().some(o => o.id !== player.id && o.role.id !== 'sheriff' && !this.hasCardOnTable(o, 'jail'));
    }
    if (card.type === 'dynamite') {
      return !this.hasCardOnTable(player, 'dynamite');
    }
    if (card.category === 'equipment') {
      return !this.hasCardOnTable(player, card.type);
    }
    return true;
  }

  getValidBangTargets(player) {
    const range = this.getWeaponRange(player);
    return this.livingPlayers().filter(o => o.id !== player.id && this.getDistance(player, o) <= range);
  }

  getValidPanicTargets(player) {
    return this.livingPlayers().filter(o => o.id !== player.id && this.getDistance(player, o) <= 1 && (o.hand.length > 0 || o.table.length > 0));
  }

  getValidCatBalouTargets(player) {
    return this.livingPlayers().filter(o => o.id !== player.id && (o.hand.length > 0 || o.table.length > 0));
  }

  async playCard(player, cardUid, targetPlayer = null, targetCardInfo = null) {
    const idx = player.hand.findIndex(c => c.uid === cardUid);
    if (idx === -1) return false;
    const card = player.hand[idx];

    const isBang = card.type === 'bang' || (card.type === 'missed' && player.character.id === 'calamity_janet');

    // Remove from hand first
    player.hand.splice(idx, 1);

    if (card.border === 'blue') {
      if (card.type === 'jail') {
        targetPlayer.table.push(card);
        this.log(`${player.name} zavřel hráče ${targetPlayer.name} do Vězení!`, 'action');
        this.ui.showToast(targetPlayer.id, '⛓️ Vězení!');
      } else if (card.category === 'weapon') {
        const oldWIdx = player.table.findIndex(c => c.category === 'weapon');
        if (oldWIdx !== -1) {
          const [oldW] = player.table.splice(oldWIdx, 1);
          this.discardCard(oldW);
        }
        player.table.push(card);
        this.log(`${player.name} si vyložil zbraň ${card.name} (dostřel ${card.range}).`, 'action');
      } else {
        player.table.push(card);
        this.log(`${player.name} si vyložil kartu ${card.name}.`, 'action');
      }
      this.checkSuzyLafayette(player);
      this.ui.renderAll();
      return true;
    }

    // Brown action card -> discard pile
    this.discardCard(card);
    this.checkSuzyLafayette(player);

    if (isBang) {
      this.bangsPlayedThisTurn++;
      if (player.role.id !== 'sheriff' && targetPlayer.role.id === 'sheriff') {
        player.hostilityToSheriff += 2;
      }
      this.log(`🔫 ${player.name} vystřelil BANG! na ${targetPlayer.name}!`, 'danger');
      this.ui.showToast(targetPlayer.id, '🎯 BANG!');
      this.ui.renderAll();
      await this.resolveBangAttack(player, targetPlayer);
    } else if (card.type === 'beer') {
      if (this.livingPlayers().length > 2 && player.hp < player.maxHp) {
        player.hp++;
        this.log(`🍺 ${player.name} vypil Pivo (+1 život).`, 'good');
        this.ui.showToast(player.id, '🍺 +1 ♥');
      }
    } else if (card.type === 'saloon') {
      for (const lp of this.livingPlayers()) {
        if (lp.hp < lp.maxHp) lp.hp++;
      }
      this.log(`🍻 ${player.name} zahrál Saloon! Všichni získali +1 život.`, 'good');
    } else if (card.type === 'stagecoach') {
      for (let i = 0; i < 2; i++) this.giveCardToPlayer(player, this.drawCardRaw());
      this.log(`🐎 ${player.name} zahrál Dostavník (+2 karty).`, 'action');
    } else if (card.type === 'wells_fargo') {
      for (let i = 0; i < 3; i++) this.giveCardToPlayer(player, this.drawCardRaw());
      this.log(`💰 ${player.name} zahrál Wells Fargo (+3 karty).`, 'action');
    } else if (card.type === 'panic') {
      await this.resolveStealOrDiscard(player, targetPlayer, true, targetCardInfo);
    } else if (card.type === 'cat_balou') {
      await this.resolveStealOrDiscard(player, targetPlayer, false, targetCardInfo);
    } else if (card.type === 'gatling') {
      this.log(`🔥 ${player.name} spustil palbu z KULOMETU na všechny!`, 'danger');
      for (const lp of this.livingPlayers()) {
        if (lp.id !== player.id) {
          await this.resolveSingleMissedCheck(player, lp, 'Kulomet');
          if (this.gameOver) break;
        }
      }
    } else if (card.type === 'indians') {
      this.log(`🏹 ${player.name} poslal INDIÁNY na všechny ostatní!`, 'danger');
      for (const lp of this.livingPlayers()) {
        if (lp.id !== player.id) {
          await this.resolveIndiansTarget(player, lp);
          if (this.gameOver) break;
        }
      }
    } else if (card.type === 'duel') {
      this.log(`⚔️ ${player.name} vyzval ${targetPlayer.name} na DUEL!`, 'danger');
      await this.resolveDuel(player, targetPlayer);
    } else if (card.type === 'general_store') {
      await this.resolveGeneralStore(player);
    }

    this.ui.renderAll();
    return true;
  }

  async resolveBangAttack(attacker, target) {
    const needed = attacker.character.id === 'slab_the_killer' ? 2 : 1;
    let dodged = 0;

    // 1. Jourdonnais innate Barrel
    if (target.character.id === 'jourdonnais' && dodged < needed) {
      const c = await this.performDrawCheck(target, 'Jourdonnais');
      if (c && c.suit === 'H') {
        dodged++;
        this.log(`🛡️ ${target.name} (Jourdonnais) uhnul díky ♥!`, 'good');
        this.ui.showToast(target.id, '🛡️ Uhnul!');
      }
    }

    // 2. Barrel on table
    if (this.hasCardOnTable(target, 'barrel') && dodged < needed) {
      const c = await this.performDrawCheck(target, 'Barel');
      if (c && c.suit === 'H') {
        dodged++;
        this.log(`🛢️ ${target.name} se schoval za Barel (♥)!`, 'good');
        this.ui.showToast(target.id, '🛢️ Barel!');
      }
    }

    // 3. Play Vedle! from hand
    while (dodged < needed) {
      const played = await this.askForMissedCard(target, `BANG! od ${attacker.name} (zbývá odvrátit: ${needed - dodged})`);
      if (played) {
        dodged++;
      } else {
        break;
      }
    }

    if (dodged >= needed) {
      this.ui.showToast(target.id, '🛡️ Vedle!');
      return;
    }

    await this.damagePlayer(target, 1, attacker);
  }

  async resolveSingleMissedCheck(attacker, target, sourceName) {
    let dodged = false;
    if (target.character.id === 'jourdonnais') {
      const c = await this.performDrawCheck(target, 'Jourdonnais');
      if (c && c.suit === 'H') dodged = true;
    }
    if (!dodged && this.hasCardOnTable(target, 'barrel')) {
      const c = await this.performDrawCheck(target, 'Barel');
      if (c && c.suit === 'H') dodged = true;
    }
    if (!dodged) {
      dodged = await this.askForMissedCard(target, sourceName);
    }
    if (dodged) {
      this.ui.showToast(target.id, '🛡️ Vedle!');
    } else {
      await this.damagePlayer(target, 1, attacker);
    }
  }

  isMissedCard(player, card) {
    return card.type === 'missed' || (card.type === 'bang' && player.character.id === 'calamity_janet');
  }

  isBangCard(player, card) {
    return card.type === 'bang' || (card.type === 'missed' && player.character.id === 'calamity_janet');
  }

  async askForMissedCard(target, reason) {
    const validCards = target.hand.filter(c => this.isMissedCard(target, c));
    if (validCards.length === 0) return false;

    let chosenCard = null;
    if (target.isHuman) {
      chosenCard = await this.ui.promptDefenseCard(target, validCards, `Obrana proti: ${reason}`, 'missed');
    } else {
      chosenCard = validCards[0];
    }

    if (!chosenCard) return false;
    const idx = target.hand.findIndex(c => c.uid === chosenCard.uid);
    target.hand.splice(idx, 1);
    this.discardCard(chosenCard);
    this.log(`🛡️ ${target.name} zahrál ${chosenCard.name} jako obranu.`, 'good');
    this.checkSuzyLafayette(target);
    this.ui.renderAll();
    return true;
  }

  async askForBangCard(target, reason) {
    const validCards = target.hand.filter(c => this.isBangCard(target, c));
    if (validCards.length === 0) return false;

    let chosenCard = null;
    if (target.isHuman) {
      chosenCard = await this.ui.promptDefenseCard(target, validCards, reason, 'bang');
    } else {
      chosenCard = validCards[0];
    }

    if (!chosenCard) return false;
    const idx = target.hand.findIndex(c => c.uid === chosenCard.uid);
    target.hand.splice(idx, 1);
    this.discardCard(chosenCard);
    this.log(`💥 ${target.name} odhodil ${chosenCard.name}.`, 'action');
    this.checkSuzyLafayette(target);
    this.ui.renderAll();
    return true;
  }

  async resolveIndiansTarget(attacker, target) {
    const ok = await this.askForBangCard(target, `Indiáni! od ${attacker.name} — odhoď BANG!`);
    if (!ok) {
      await this.damagePlayer(target, 1, attacker);
    }
  }

  async resolveDuel(challenger, target) {
    let current = target;
    let other = challenger;
    while (true) {
      const ok = await this.askForBangCard(current, `Duel s ${other.name} — odhoď BANG!`);
      if (!ok) {
        this.log(`⚔️ ${current.name} prohrál Duel!`, 'danger');
        await this.damagePlayer(current, 1, other);
        break;
      }
      [current, other] = [other, current];
    }
  }

  async resolveStealOrDiscard(actor, target, isSteal, presetInfo) {
    let choice = presetInfo;
    if (!choice) {
      if (actor.isHuman) {
        choice = await this.ui.promptTargetCard(target, isSteal ? 'Panika! — Vezmi kartu' : 'Cat Balou — Odhoď kartu');
      } else {
        if (target.table.length > 0) {
          choice = { zone: 'table', index: 0 };
        } else {
          choice = { zone: 'hand', index: Math.floor(Math.random() * target.hand.length) };
        }
      }
    }

    let takenCard = null;
    if (choice.zone === 'table' && target.table[choice.index]) {
      takenCard = target.table.splice(choice.index, 1)[0];
    } else if (target.hand.length > 0) {
      const rIdx = choice.index !== undefined && target.hand[choice.index] ? choice.index : Math.floor(Math.random() * target.hand.length);
      takenCard = target.hand.splice(rIdx, 1)[0];
      this.checkSuzyLafayette(target);
    }

    if (!takenCard) return;
    if (isSteal) {
      actor.hand.push(takenCard);
      this.log(`✋ ${actor.name} ukradl kartu hráči ${target.name} (${choice.zone === 'table' ? takenCard.name : 'z ruky'}).`, 'action');
    } else {
      this.discardCard(takenCard);
      this.log(`🗑️ ${actor.name} donutil ${target.name} odhodit ${takenCard.name}.`, 'action');
    }
  }

  async resolveGeneralStore(starter) {
    const living = this.livingPlayers();
    const startIdx = living.findIndex(p => p.id === starter.id);
    const pool = [];
    for (let i = 0; i < living.length; i++) {
      const c = this.drawCardRaw();
      if (c) pool.push(c);
    }
    this.log(`🏪 Hokynářství! Otočeno ${pool.length} karet.`, 'action');

    for (let i = 0; i < living.length && pool.length > 0; i++) {
      const p = living[(startIdx + i) % living.length];
      let chosenIdx = 0;
      if (p.isHuman) {
        chosenIdx = await this.ui.promptGeneralStore(pool);
      } else {
        let best = 0;
        for (let j = 1; j < pool.length; j++) {
          if (this.aiCardValue(pool[j], p) > this.aiCardValue(pool[best], p)) best = j;
        }
        chosenIdx = best;
      }
      const [picked] = pool.splice(chosenIdx, 1);
      p.hand.push(picked);
      this.log(`${p.name} si vybral ${picked.name}.`, 'system');
      this.ui.renderAll();
    }
  }

  async damagePlayer(target, amount, attacker) {
    for (let i = 0; i < amount; i++) {
      if (!target.alive) break;
      target.hp--;
      this.log(`🩸 ${target.name} ztratil 1 život (zbývá ${Math.max(0, target.hp)}/${target.maxHp}).`, 'danger');
      this.ui.showToast(target.id, '🩸 -1 ♥');

      // Auto-Beer save if hp <= 0 and > 2 players remain
      if (target.hp <= 0 && this.livingPlayers().length > 2) {
        const beerIdx = target.hand.findIndex(c => c.type === 'beer');
        if (beerIdx !== -1) {
          const [beer] = target.hand.splice(beerIdx, 1);
          this.discardCard(beer);
          target.hp = 1;
          this.log(`🍺 ${target.name} se zachránil na poslední chvíli kartou Pivo!`, 'good');
          this.ui.showToast(target.id, '🍺 Záchrana!');
          this.checkSuzyLafayette(target);
        }
      }

      if (target.hp > 0) {
        if (target.character.id === 'bart_cassidy') {
          const c = this.drawCardRaw();
          if (c) target.hand.push(c);
          this.log(`${target.name} (Bart Cassidy) si lízl 1 kartu za zranění.`, 'ability');
        }
        if (target.character.id === 'el_gringo' && attacker && attacker.id !== target.id && attacker.hand.length > 0) {
          const rIdx = Math.floor(Math.random() * attacker.hand.length);
          const [stolen] = attacker.hand.splice(rIdx, 1);
          target.hand.push(stolen);
          this.checkSuzyLafayette(attacker);
          this.log(`${target.name} (El Gringo) si vzal 1 kartu od ${attacker.name}.`, 'ability');
        }
      } else {
        await this.eliminatePlayer(target, attacker);
        break;
      }
    }
    this.ui.renderAll();
  }

  async eliminatePlayer(victim, attacker) {
    victim.alive = false;
    victim.hp = 0;
    victim.revealedRole = true;
    this.log(`💀 ${victim.name} byl vyřazen! Jeho role byla: ${victim.role.name}.`, 'important');
    this.ui.showToast(victim.id, `💀 ${victim.role.name}`);

    // Vulture Sam takes all cards
    const vulture = this.livingPlayers().find(p => p.character.id === 'vulture_sam' && p.id !== victim.id);
    if (vulture) {
      const loot = [...victim.hand, ...victim.table];
      victim.hand = [];
      victim.table = [];
      vulture.hand.push(...loot);
      if (loot.length > 0) {
        this.log(`🦅 ${vulture.name} (Vulture Sam) si vzal všech ${loot.length} karet vyřazeného hráče.`, 'ability');
      }
    } else {
      victim.hand.forEach(c => this.discardCard(c));
      victim.table.forEach(c => this.discardCard(c));
      victim.hand = [];
      victim.table = [];
    }

    // Check win condition BEFORE rewards
    if (this.checkWinCondition()) return;

    // Rewards / Penalties
    if (attacker && attacker.alive) {
      if (victim.role.id === 'outlaw') {
        for (let i = 0; i < 3; i++) this.giveCardToPlayer(attacker, this.drawCardRaw());
        this.log(`💰 ${attacker.name} vyřadil Banditu a získává odměnu 3 karty!`, 'good');
      } else if (victim.role.id === 'deputy' && attacker.role.id === 'sheriff') {
        attacker.hand.forEach(c => this.discardCard(c));
        attacker.table.forEach(c => this.discardCard(c));
        attacker.hand = [];
        attacker.table = [];
        this.log(`⚠️ Šerif ${attacker.name} omylem zabil svého Pomocníka a musí odhodit všechny karty!`, 'danger');
      }
    }
  }

  checkWinCondition() {
    const living = this.livingPlayers();
    const sheriffAlive = living.some(p => p.role.id === 'sheriff');
    const outlawsAlive = living.some(p => p.role.id === 'outlaw');
    const renegadeAlive = living.some(p => p.role.id === 'renegade');

    if (!sheriffAlive) {
      this.gameOver = true;
      this.phase = 'gameover';
      if (living.length === 1 && living[0].role.id === 'renegade') {
        this.winner = { title: 'Vítězí Odpadlík!', desc: `${living[0].name} zůstal poslední naživu.`, team: 'renegade' };
      } else {
        this.winner = { title: 'Vítězí Bandité!', desc: 'Šerif byl eliminován.', team: 'outlaw' };
      }
    } else if (!outlawsAlive && !renegadeAlive) {
      this.gameOver = true;
      this.phase = 'gameover';
      this.winner = { title: 'Vítězí Šerif a jeho Pomocníci!', desc: 'Všichni Bandité a Odpadlík byli eliminováni.', team: 'law' };
    }

    if (this.gameOver) {
      this.players.forEach(p => { p.revealedRole = true; });
      this.log(`🏆 KONEC HRY: ${this.winner.title}`, 'important');
      this.ui.renderAll();
      this.ui.showGameOver(this.winner);
      return true;
    }
    return false;
  }

  // Sid Ketchum ability

        } else if (card.type === 'cat_balou') {
          target = this.pickAITarget(ai, this.getValidCatBalouTargets(ai));
        } else if (card.type === 'duel') {
          const bangCount = ai.hand.filter(c => this.isBangCard(ai, c)).length;
          if (bangCount < 1) continue;
          target = this.pickAITarget(ai, this.livingPlayers().filter(o => o.id !== ai.id));
        } else if (card.type === 'jail') {
          const jailTargets = this.livingPlayers().filter(o => o.id !== ai.id && o.role.id !== 'sheriff' && !this.hasCardOnTable(o, 'jail'));

        } else if (card.type === 'indians') {
          if (ai.role.id === 'deputy' && this.players.find(p => p.role.id === 'sheriff')?.hp <= 1) continue;
        } else if (card.type === 'gatling') {
          if (ai.role.id === 'deputy' && this.players.find(p => p.role.id === 'sheriff')?.hp <= 1) continue;
        } else if (card.category === 'weapon') {
          const curRange = this.getWeaponRange(ai);
          if (card.range < curRange && card.type !== 'volcanic') continue;
        }

        await this.playCard(ai, card.uid, target);
        madeMove = true;
        await this.sleep(1100);
        break;
      }
    }
  }

    return new Promise(res => setTimeout(res, Math.round(ms * (this.speedMultiplier || 1))));
  }

  }
  showGameOver(winner) {
    const rolesSummary = this.engine.players.map(p => `<div style="padding:4px 8px;background:rgba(0,0,0,0.3);border-radius:4px"><strong>${p.name}</strong> (${p.character.name}) — <span style="color:#fde047">${p.role.name}</span> ${p.alive ? '✅' : '💀'}</div>`).join('');
    const body = this.showModal('🏆 Konec hry', `<h3 style="text-align:center;color:#fde047;margin:6px 0">${winner.title}</h3><p style="text-align:center;margin:0 0 12px 0">${winner.desc}</p><div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">${rolesSummary}</div><div style="text-align:center"><button class="btn btn-gold" id="go-new">Hrát znovu</button></div>`);
    body.querySelector('#go-new').onclick = () => { this.hideModal(); this.openSetupModal(); };
  }
  openGalleryModal() {
    const allCards = buildDeck();
    const renderTab = (tab) => {
      let content = '';
      if (tab === 'roles') ROLES.forEach(r => { for (let i = 0; i < r.count; i++) content += this.renderRoleCardHTML(r); });
      else if (tab === 'chars') CHARACTERS.forEach(c => { content += this.renderCharacterCardHTML(c); });
      else if (tab === 'brown') allCards.filter(c => c.border === 'brown').forEach(c => { content += this.renderCardHTML(c); });
      else if (tab === 'blue') allCards.filter(c => c.border === 'blue').forEach(c => { content += this.renderCardHTML(c); });
      return content;
    };
    const showTab = (tab) => {
      const body = this.showModal('Katalog 103 karet', `<div class="gallery-tabs"><button class="btn ${tab === 'roles' ? 'btn-gold' : ''}" data-tab="roles">7 Rolí</button><button class="btn ${tab === 'chars' ? 'btn-gold' : ''}" data-tab="chars">16 Postav</button><button class="btn ${tab === 'brown' ? 'btn-gold' : ''}" data-tab="brown">Hnědé (63)</button><button class="btn ${tab === 'blue' ? 'btn-gold' : ''}" data-tab="blue">Modré (17)</button><button class="btn btn-primary" id="gal-close" style="margin-left:auto">✕</button></div><div class="gallery-grid">${renderTab(tab)}</div>`);
      body.querySelectorAll('[data-tab]').forEach(btn => { btn.onclick = () => showTab(btn.dataset.tab); });
      body.querySelector('#gal-close').onclick = () => this.hideModal();
    };
    showTab('chars');
  }
  openRulesModal() {
    const body = this.showModal('Pravidla BANG!', `<div style="font-family:system-ui,sans-serif;font-size:13px;line-height:1.5"><p><strong>Role (7):</strong> Šerif a Pomocníci eliminují Bandity a Odpadlíka. Bandité chtějí zabít Šerifa. Odpadlík chce zůstat poslední naživu.</p><p><strong>Tah:</strong> 1) Dynamit & Vězení. 2) Dobrat 2 karty. 3) Zahrát karty (max. 1× BANG! za tah bez Volcanic/Willyho). 4) Odhodit karty nad limit životů.</p><div style="text-align:center;margin-top:12px"><button class="btn btn-gold" id="rules-close">Zavřít</button></div></div>`);
    body.querySelector('#rules-close').onclick = () => this.hideModal();
  }
}

const ui = new MobileBangUI();
const engine = new BangEngine(ui);
ui.init(engine);
  </script>
</body>
</html>
